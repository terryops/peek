name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  remote:
    name: Go Remote Helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: Remote/go.mod
      - name: Test & Vet Remote
        working-directory: Remote
        run: |
          go vet ./...
          go test -race ./...
      - name: Cross-compile Remote Binaries
        run: ./Scripts/build-remote.sh

  macos:
    name: macOS App & Tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: Remote/go.mod
      - name: Run Swift Test Suite
        run: ./Scripts/test.sh
      - name: Build Apple Silicon Peek.app & Self-Test
        run: |
          ./Scripts/build.sh
          test "$(lipo -archs build/Peek.app/Contents/MacOS/Peek)" = arm64
